<!-- sldsValidatorIgnore -->
<template>
    <!-- Admin view: show only the component name, no modal -->
    <template lwc:if={isAdmin}>
        <div class="slds-box slds-theme_default slds-align_absolute-center admin-view">
            <span class="slds-text-title_caps admin-view__label">Scheduled Maintenance Component (Admin View)</span>
        </div>
    </template>
    <!-- Non-admin view: show modal as normal -->
    <template lwc:elseif={isModalOpen}>
        <!-- Focus guards keep Tab and Shift+Tab inside the dialog -->
        <div tabindex="0" aria-hidden="true" onfocus={handleFocusStartGuard}></div>
        <section role={dialogRole} tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" aria-describedby="modal-content" class="slds-modal slds-fade-in-open" onkeydown={handleDialogKeyDown}>
            <div class="slds-modal__container">
                <header class={headerClass}>
                    <template lwc:if={isDismissible}>
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={dismissAllRecords}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                    </template>
                    <h1 id="modal-heading" class="slds-modal__title slds-hyphenate">{modalTitle}</h1>
                    <template lwc:if={isAppClosed}>
                        <p class="slds-m-top_x-small lock-summary">
                            <lightning-icon icon-name="utility:lock" size="x-small" alternative-text="Locked" class="slds-m-right_x-small"></lightning-icon>
                            <strong>{lockSummary}</strong>
                        </p>
                        <p class="slds-m-top_xx-small">This page unlocks automatically when the maintenance ends.</p>
                    </template>
                </header>
                <div id="modal-content" class="slds-modal__content slds-p-around_medium modal-content">
                    <!-- While a maintenance is in progress: 'In Progress' and 'Upcoming' accordion sections -->
                    <template lwc:if={isInMaintenance}>
                        <lightning-accordion allow-multiple-sections-open active-section-name={activeSectionName}>
                            <template lwc:if={inProgressMaintenances.length}>
                                <lightning-accordion-section name="inProgress" label="In Progress">
                                    <template for:each={inProgressMaintenances} for:item="maint">
                                        <c-maintenance-card key={maint.Id} maintenance={maint}></c-maintenance-card>
                                    </template>
                                </lightning-accordion-section>
                            </template>
                            <template lwc:if={upcomingMaintenances.length}>
                                <lightning-accordion-section name="upcoming" label="Upcoming">
                                    <template for:each={upcomingMaintenances} for:item="maint">
                                        <c-maintenance-card key={maint.Id} maintenance={maint}></c-maintenance-card>
                                    </template>
                                </lightning-accordion-section>
                            </template>
                        </lightning-accordion>
                    </template>
                    <!-- Otherwise a list of reminders -->
                    <template lwc:else>
                        <template for:each={scheduledMaintenances} for:item="maint">
                            <c-maintenance-card key={maint.Id} maintenance={maint}></c-maintenance-card>
                        </template>
                    </template>
                </div>
                <template lwc:if={hasFooterButtons}>
                    <footer class="slds-modal__footer">
                        <template lwc:if={isDismissible}>
                            <lightning-button variant="neutral" label="Dismiss" title="Dismiss" onclick={dismissAllRecords}></lightning-button>
                        </template>
                        <template lwc:elseif={showExitButton}>
                            <lightning-button variant="brand" label={exitButtonLabel} title={exitButtonLabel} onclick={navigateToApp}></lightning-button>
                        </template>
                    </footer>
                </template>
            </div>
        </section>
        <div tabindex="0" aria-hidden="true" onfocus={handleFocusEndGuard}></div>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
