<template>
    <div class="slds-box slds-theme_default slds-var-m-bottom_small">
        <h2 class="slds-text-heading_small slds-var-m-bottom_small"><strong>{maintenance.Subject}</strong></h2>
        <p class="slds-p-bottom_small multi-line"><strong>Description:</strong> {maintenance.Description__c}</p>
        <p><strong>Start:</strong> {maintenance.startDisplay}</p>
        <p><strong>End:</strong> {maintenance.endDisplay}</p>
        <template lwc:if={showLockBadge}>
            <lightning-badge label={maintenance.BadgeLabel} class="slds-m-left_xx-small slds-m-top_x-small slds-theme_warning"></lightning-badge>
        </template>
        <template lwc:if={hasAppBadges}>
            <div class="slds-m-top_x-small">
                <div class="slds-box slds-theme_shade slds-p-around_small slds-m-bottom_xx-small">
                    <div class="slds-text-title_caps slds-m-bottom_x-small">Applicable Apps</div>
                    <div class="slds-grid slds-wrap slds-gutters_xx-small">
                        <template for:each={maintenance.appBadges} for:item="app">
                            <span key={app} class="slds-badge slds-badge_lightest">{app}</span>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
