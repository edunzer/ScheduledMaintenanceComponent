<template>
    <article class="slds-box slds-box_small slds-var-m-bottom_small">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start slds-gutters_x-small">
            <h3 class="slds-col slds-text-heading_small">{maintenance.Subject}</h3>
            <template lwc:if={maintenance.lockLabel}>
                <div class="slds-col slds-no-flex">
                    <lightning-badge label={maintenance.lockLabel} icon-name="utility:lock" class={lockBadgeClass}></lightning-badge>
                </div>
            </template>
        </div>
        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small date-range">{maintenance.dateRange}</p>
        <template lwc:if={maintenance.Description__c}>
            <p class="slds-m-top_x-small multi-line">{maintenance.Description__c}</p>
        </template>
        <p class="slds-text-body_small slds-m-top_x-small affects">
            <span class="slds-text-color_weak">Affects:</span> {maintenance.affects}
        </p>
    </article>
</template>
